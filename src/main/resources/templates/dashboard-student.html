<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Course Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="bg-light">
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">CourseCenter</a>
        <div class="d-flex align-items-center">
            <a th:href="@{${@environment.getProperty('app.paths.frontend-base')} + ${@environment.getProperty('app.paths.course-base')}}"
               class="btn btn-outline-primary me-2">
                <i class="bi bi-book me-1"></i> Browse Courses
            </a>

            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-4">
    <!-- User Profile Section -->
    <div class="card mb-4 user-profile-card">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                     style="width: 80px; height: 80px; font-size: 2rem;">
                </div>
                <div class="ms-4">
                    <h3 class="mb-1" sec:authentication="principal.fullName"></h3>
                    <p class="text-muted mb-2" sec:authentication="principal.email"></p>
                    <span class="badge bg-primary">Student</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Enrolled Courses Section -->
    <div class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">My Enrolled Courses</h2>
            <a th:href="@{${@environment.getProperty('app.paths.frontend-base')} + ${@environment.getProperty('app.paths.course-base')}}"
               class="btn btn-sm btn-outline-primary">View All Courses</a>
        </div>
        <div id="enrolledCourses" class="row g-4">
            <!-- Enrolled courses will be loaded here -->
            <div class="col-12 text-center py-5" id="noEnrolledCourses">
                <div class="empty-state">
                    <i class="bi bi-book"></i>
                    <h4 class="mt-3">You haven't enrolled in any courses yet</h4>
                    <p class="mb-4">Discover our courses and start learning today!</p>
                    <a th:href="@{/courses}" class="btn btn-primary">
                        <i class="bi bi-search me-2"></i>Browse Courses
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Recommended Courses Section -->
    <div class="mb-5">
        <h2 class="fw-bold mb-4">Recommended For You</h2>
        <div id="recommendedCourses">
            <div class="row g-4" id="recommendedCoursesContainer">
                <!-- Recommended courses will be loaded here -->
            </div>
            <div id="loadingSpinner" class="loading-spinner"></div>
        </div>
    </div>
</div>


<!-- Notification box -->

<div id="notification" class="notification-container">
    <div id="alertBox" class="alert" role="alert">
        <span id="notificationMessage"></span>
        <button type="button" class="btn-close" onclick="hideNotification()" aria-label="Close"></button>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="confirmationModalLabel">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmationMessage">
                <!-- Message will be inserted here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmAction">Confirm</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.APP_CONFIG = {
    apiBase: "[[${@environment.getProperty('app.paths.api-base')}]]",
    authBase: "[[${@environment.getProperty('app.paths.auth-base')}]]",
    frontendBase: "[[${@environment.getProperty('app.paths.frontend-base')}]]",
    userBase: "[[${@environment.getProperty('app.paths.user-base')}]]",
    courseBase: "[[${@environment.getProperty('app.paths.course-base')}]]",
    enrollmentBase: "[[${@environment.getProperty('app.paths.enrollment-base')}]]"
  };
</script>
<script th:src="@{/js/dashboard-student.js}"></script>
</body>
</html>
