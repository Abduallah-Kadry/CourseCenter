<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Course Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/course-details.css}">


</head>
<body>

<!--
    TODO i want to show content based on the authentication ... either by separate files or by separate sec:authorize
    TODO Make sure that the url here is only for auth
    TODO in the student dashboard just show it's current enrolled courses and random 3 courses that he is not enrolled and show it's data

-->

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <div class="d-flex flex-column p-3">
                <h4 class="text-center mb-4">Admin Panel</h4>
                <hr>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" id="users-tab">
                            <i class="bi bi-people me-2"></i> Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{${@environment.getProperty('app.paths.frontend-base')} + ${@environment.getProperty('app.paths.course-base')}}" class="nav-link">
                            <i class="bi bi-house-door me-2"></i> Back to Courses
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">User Management</h1>
            </div>

            <!-- Users Table -->
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    <!-- Users will be loaded here via JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination will be added here via JavaScript -->
                </ul>
            </nav>
        </div>
    </div>
</div>


<!-- Notification box -->

<div id="notification" class="notification-container">
    <div id="alertBox" class="alert" role="alert">
        <span id="notificationMessage"></span>
        <button type="button" class="btn-close" onclick="hideNotification()" aria-label="Close"></button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

  window.APP_CONFIG = {
    apiBase: "[[${@environment.getProperty('app.paths.api-base')}]]",
    authBase: "[[${@environment.getProperty('app.paths.auth-base')}]]",
    frontendBase: "[[${@environment.getProperty('app.paths.frontend-base')}]]",
    userBase: "[[${@environment.getProperty('app.paths.user-base')}]]",
    courseBase: "[[${@environment.getProperty('app.paths.course-base')}]]"
  };

</script>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
