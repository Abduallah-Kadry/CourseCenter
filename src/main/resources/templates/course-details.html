<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/course-details.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{${@environment.getProperty('app.paths.frontend-base')} + ${@environment.getProperty('app.paths.course-base')}}">
            <i class="bi bi-arrow-left"></i> Back to Courses
        </a>

        <a sec:authorize="!isAuthenticated()"
           th:href="@{|${@environment.getProperty('app.paths.frontend-base')}/login|}"
           class="btn btn-primary btn-sm me-2">
            <i class="bi me-1"></i> Login
        </a>
        <div class="d-flex" sec:authorize="isAuthenticated()">
            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<div class="container my-5" th:if="${course != null}">
    <div class="row">
        <div class="col-lg-8">
            <img th:src="${course.imageUrl} ?: 'https://via.placeholder.com/800x400'"
                 class="course-image mb-4"
                 th:alt="${course.name} ?: 'Course Image'"
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/800x400'">

            <h1 th:text="${course.name} ?: 'Untitled Course'"></h1>

            <div class="d-flex align-items-center mb-4">
                <div class="rating me-3" id="ratingStars">
                    <!-- Stars will be inserted here by JavaScript -->
                </div>
                <span class="text-muted" id="averageRating">
                    <!-- Rating value will be inserted here by JavaScript -->
                </span>

            </div>

            <div class="course-content">
                <h3>About This Course</h3>
                <p class="lead" th:text="${course.description} ?: 'No description available.'"></p>

                <div class="mt-4">
                    <h4>What You'll Learn</h4>
                    <ul class="list-unstyled">
                        <li><i class="fas fa-check text-success me-2"></i>Comprehensive course materials</li>
                        <li><i class="fas fa-check text-success me-2"></i>Hands-on exercises</li>
                        <li><i class="fas fa-check text-success me-2"></i>Certificate of completion</li>
                        <li><i class="fas fa-check text-success me-2"></i>24/7 support</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="price mb-3">
                        $<span th:text="${#numbers.formatDecimal(course.cost, 0, 2)}"></span>
                    </div>

                    <div class="d-grid gap-2" sec:authorize="!hasRole('ROLE_ADMIN')">
                        <button class="btn btn-success btn-lg" disabled th:if="${isEnrolled}">
                            <i class="fas fa-check me-2"></i>Enrolled
                        </button>
                        <button class="btn btn-primary btn-lg enroll-btn" th:if="${isEnrolled == false}">
                            Enroll Now
                        </button>
                    </div>

                    <div class="d-grid gap-2" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="btn btn-primary btn-lg enroll-btn"
                           th:href="${@environment.getProperty('app.paths.frontend-base')} + ${@environment.getProperty('app.paths.course-base')} + '/update/' + ${course.id}">
                            <i class="bi bi-pencil-square me-2"></i>Update Course
                        </a>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <h5>Course Details</h5>
                        <ul class="list-unstyled">
                            <li class="mb-2">
                                <i class="far fa-clock me-2 text-muted"></i>
                                <span th:text="'Duration: ' + ${course.creditHours} + ' hours'"></span>
                            </li>
                            <li class="mb-2">
                                <i class="fas fa-layer-group me-2 text-muted"></i>
                                <span>Level: All Levels</span>
                            </li>
                            <li class="mb-2">
                                <i class="fas fa-language me-2 text-muted"></i>
                                <span>Language: English</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container my-5" th:unless="${course != null}">
    <div class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        Failed to load course details.
        <button class="btn btn-link p-0 ms-2" onclick="window.location.reload()">
            <i class="fas fa-sync-alt"></i> Try Again
        </button>
    </div>
</div>

<script>
  window.APP_CONFIG = {
    apiBase: "[[${@environment.getProperty('app.paths.api-base')}]]",
    authBase: "[[${@environment.getProperty('app.paths.auth-base')}]]",
    frontendBase: "[[${@environment.getProperty('app.paths.frontend-base')}]]",
    courseBase: "[[${@environment.getProperty('app.paths.course-base')}]]",
    userBase: "[[${@environment.getProperty('app.paths.user-base')}]]"
  };
</script>

<div id="notification" class="notification-container">
    <div id="alertBox" class="alert" role="alert">
        <span id="notificationMessage"></span>
        <button type="button" class="btn-close" onclick="hideNotification()" aria-label="Close"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/course-details.js}"></script>
</body>
</html>
