<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/courses.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CourseCenter</a>
        <div class="d-flex">
            <a sec:authorize="hasRole('ROLE_ADMIN')"
               th:href="@{|${@environment.getProperty('app.paths.frontend-base')}${@environment.getProperty('app.paths.course-base')}/add|}"
               class="btn btn-primary btn-sm me-2">
                <i class="bi bi-plus-circle me-1"></i> Add Course
            </a>
            <a sec:authorize="!isAuthenticated()"
               th:href="@{|${@environment.getProperty('app.paths.frontend-base')}/login|}"
               class="btn btn-primary btn-sm me-2">
                <i class="bi me-1"></i> Login
            </a>
            <button sec:authorize="isAuthenticated()"
                    id="logoutBtn"
                    class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h2 class="mb-4 text-center fw-bold">Available Courses </h2>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center my-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading courses...</p>
    </div>


    <!-- Courses Grid -->
    <div id="coursesGrid" class="row g-4">
        <!-- Will be populated by JavaScript -->
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation" class="mt-4">
        <ul id="pagination" class="pagination justify-content-center">
            <!-- Will be populated by JavaScript -->
        </ul>
    </nav>

</div>
<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

  window.APP_CONFIG = {
    apiBase: "[[${@environment.getProperty('app.paths.api-base')}]]",
    authBase: "[[${@environment.getProperty('app.paths.auth-base')}]]",
    frontendBase: "[[${@environment.getProperty('app.paths.frontend-base')}]]",
    courseBase: "[[${@environment.getProperty('app.paths.course-base')}]]"
  };

</script>

<script th:src="@{/js/courses.js}"></script>
</body>
</html>
